services:
  - type: web
    name: avengers-doomsday-fanalyzer
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/samples
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: X_BEARER_TOKEN
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4-1-fast-non-reasoning
      - key: XAI_FANDOM_MODEL
        value: grok-4.5
